name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Cloudflare auth
        env:
          CF_OAUTH: ${{ secrets.CF_OAUTH_TOKEN }}
          CF_REFRESH: ${{ secrets.CF_REFRESH_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/.wrangler/config"
          printf 'oauth_token = "%s"\nrefresh_token = "%s"\n' "$CF_OAUTH" "$CF_REFRESH" \
            > "$HOME/.config/.wrangler/config/default.toml"
          mkdir -p "$HOME/.wrangler/config"
          cp "$HOME/.config/.wrangler/config/default.toml" "$HOME/.wrangler/config/default.toml"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=habio --branch=main --commit-message="deploy from GitHub Actions"
